name: Build downloadable archives and screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "versions/**"
      - "scripts/**"
      - ".github/workflows/build-downloads.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build version archives
        run: python scripts/build_archives.py
      - name: Install Chromium capture dependencies
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Capture playable screenshots
        continue-on-error: true
        run: python scripts/capture_screenshots.py
      - name: Commit generated downloads and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives assets/screenshots
          if git diff --cached --quiet; then
            echo "Generated artifacts unchanged."
          else
            git commit -m "Generate version download ZIPs and browser screenshots [skip ci]"
            git push
          fi
