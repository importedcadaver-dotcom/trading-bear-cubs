name: v5.1 gameplay reliability CI

on:
  push:
    branches: [feature/v5.1-gameplay-reliability]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated HTML matches maintained source layers
        run: python3 scripts/build_standalone.py --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install open-source browser QA tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest hypothesis
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install JavaScript dev dependencies
        run: npm ci --no-fund
      - name: Audit npm dependencies (high severity blocks deployment)
        run: npm audit --audit-level=high
      - name: Run Vitest economy unit tests and Vite static build
        run: |
          npm run test
          npm run build
      - name: Run property-based game state regression
        run: pytest -q tests/test_state_invariants_v51.py
      - name: Run real-origin gameplay regression
        run: python tests/reliability_v51.py
      - name: Test save import integrity, migration, exploitation and error feedback
        run: python tests/security_v512.py
      - name: Test actual saved progress from historical v1-v5 browser builds
        run: python tests/historical_save_migrations_v512.py
      - name: Test physical NPC travel, user settings and mobile touch
        run: python tests/world_ui_v52.py
      - name: Test tutorial accessibility and mobile target sizing
        run: python tests/accessibility_v522.py
      - name: Upload screenshot and interaction trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v51-playtest-${{ github.run_id }}
          path: test-results/v51/
          if-no-files-found: warn
          retention-days: 7
