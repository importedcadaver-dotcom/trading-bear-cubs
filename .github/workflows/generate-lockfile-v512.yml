name: Create v5.1.2 reproducible npm lockfile (temporary)
on:
  push:
    branches: [fix/v5.1.2-security-save-integrity]
    paths:
      - package.json
      - .github/workflows/generate-lockfile-v512.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve packages and generate only the lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          test -s package-lock.json
      - name: Verify resolved dependency vulnerabilities
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm run test
          npm run build
      - name: Commit deterministic lockfile to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Lock tested v5.1.2 npm dependency graph"
            git push origin HEAD:fix/v5.1.2-security-save-integrity
          fi
