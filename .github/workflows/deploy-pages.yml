name: Publish playable website on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest hypothesis
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dev dependencies
        run: npm install --no-fund
      - name: Run Vitest economy unit tests and Vite static build
        run: |
          npm run test
          npm run build
      - name: Run property-based game state regression
        run: pytest -q tests/test_state_invariants_v51.py
      - name: Validate real click-to-talk, trading, storage and responsive UI
        run: python tests/reliability_v51.py
      - name: Upload browser trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-v51-${{ github.run_id }}
          path: test-results/v51/
          if-no-files-found: warn
          retention-days: 7
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -r assets _site/assets; fi
          if [ -d archives ]; then cp -r archives _site/archives; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
